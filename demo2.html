<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plant SVG - Unified Botanical Kinematics</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .plant-wrap {
      width: 100%;
      height: 100%;
      max-width: 650px;
      max-height: 1000px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Primary SVG */
    svg.moving-z,
    .moving-z {
      width: 100%;
      height: 100%;
      max-width: 650px;
      max-height: 1000px;
      background: transparent;
      overflow: visible;
      transform-style: preserve-3d;
    }

    /* Botanical Kinematics Base */
    .moving-z .sway-node {
      transform-box: view-box;
      transform-origin: var(--ox) var(--oy);
      transform-style: preserve-3d;
      animation-iteration-count: infinite;
      animation-timing-function: cubic-bezier(0.44, 0.05, 0.52, 0.95);
      will-change: transform;
    }

    /* 1. CENTRAL MAIN STEM / TRUNK (Parent of ALL branches and leaves)
       Rooted at pot base: (294.1px, 732.9px). Fresh Wind timing: 4.9s */
    .moving-z .sway-stem {
      --ox: 294.1px;
      --oy: 732.9px;
      animation-name: swayMainStem;
      animation-duration: 4.9s;
      animation-delay: -1.0s;
    }
    @keyframes swayMainStem {
      0%   { transform: rotate(-1.6deg); }
      32%  { transform: rotate(1.2deg); }
      60%  { transform: rotate(2.4deg); }
      82%  { transform: rotate(-0.3deg); }
      100% { transform: rotate(-1.6deg); }
    }

    /* 2. BRANCH 1 (Upper Left Branch, anchored on Main Stem at 290.5px, 262.2px) */
    .moving-z .sway-branch-1 {
      --ox: 290.5px;
      --oy: 262.2px;
      animation-name: swayBranch1;
      animation-duration: 3.5s;
      animation-delay: -1.4s;
    }
    @keyframes swayBranch1 {
      0%   { transform: rotate(-2.4deg); }
      36%  { transform: rotate(1.6deg); }
      70%  { transform: rotate(2.2deg); }
      100% { transform: rotate(-2.4deg); }
    }

    /* 3. LEAF 1 (Attached to Branch 1 tip at 194.2px, 232.7px) */
    .moving-z .sway-leaf-1 {
      --ox: 194.2px;
      --oy: 232.7px;
      animation-name: swayLeaf1;
      animation-duration: 2.3s;
      animation-delay: -0.6s;
    }
    @keyframes swayLeaf1 {
      0%   { transform: rotateZ(-4.6deg) rotateY(-15deg) rotateX(5deg) scale(1); }
      34%  { transform: rotateZ(3.8deg) rotateY(12deg) rotateX(-6deg) scale(1.018); }
      68%  { transform: rotateZ(4.8deg) rotateY(-9deg) rotateX(4deg) scale(0.99); }
      100% { transform: rotateZ(-4.6deg) rotateY(-15deg) rotateX(5deg) scale(1); }
    }

    /* 4. BRANCH 3 (Middle Left Branch, anchored at base with Main Stem: 293.8px, 732.0px) */
    .moving-z .sway-branch-3 {
      --ox: 293.8px;
      --oy: 732.0px;
      animation-name: swayBranch3;
      animation-duration: 4.9s;
      animation-delay: -1.0s;
    }
    @keyframes swayBranch3 {
      0%   { transform: rotate(-0.8deg); }
      32%  { transform: rotate(0.6deg); }
      60%  { transform: rotate(1.0deg); }
      82%  { transform: rotate(-0.2deg); }
      100% { transform: rotate(-0.8deg); }
    }

    /* 5. LEAF 3 (Attached to Branch 3 at 188.8px, 403.0px - IN FRONT of Main Stem!) */
    .moving-z .sway-leaf-3 {
      --ox: 188.8px;
      --oy: 403.0px;
      animation-name: swayLeaf3;
      animation-duration: 2.7s;
      animation-delay: -1.8s;
    }
    @keyframes swayLeaf3 {
      0%   { transform: rotateZ(-3.6deg) rotateY(10deg) rotateX(-6deg) scale(1); }
      36%  { transform: rotateZ(4.2deg) rotateY(-12deg) rotateX(5deg) scale(1.012); }
      72%  { transform: rotateZ(2.8deg) rotateY(7deg) rotateX(-3deg) scale(0.995); }
      100% { transform: rotateZ(-3.6deg) rotateY(10deg) rotateX(-6deg) scale(1); }
    }

    /* 6. BRANCH 2 (Middle Right Branch, anchored on Main Stem at 295.1px, 502.9px) */
    .moving-z .sway-branch-2 {
      --ox: 295.1px;
      --oy: 502.9px;
      animation-name: swayBranch2;
      animation-duration: 3.7s;
      animation-delay: -0.5s;
    }
    @keyframes swayBranch2 {
      0%   { transform: rotate(-2.2deg); }
      34%  { transform: rotate(1.4deg); }
      66%  { transform: rotate(2.0deg); }
      88%  { transform: rotate(-1.0deg); }
      100% { transform: rotate(-2.2deg); }
    }

    /* 7. LEAF 2 (Attached to Branch 2 tip at 438.1px, 448.6px) */
    .moving-z .sway-leaf-2 {
      --ox: 438.1px;
      --oy: 448.6px;
      animation-name: swayLeaf2;
      animation-duration: 2.5s;
      animation-delay: -1.5s;
    }
    @keyframes swayLeaf2 {
      0%   { transform: rotateZ(-4.2deg) rotateY(-8deg) rotateX(4deg) scale(1); }
      30%  { transform: rotateZ(2.8deg) rotateY(14deg) rotateX(-5deg) scale(1.015); }
      64%  { transform: rotateZ(4.6deg) rotateY(-10deg) rotateX(3deg) scale(0.992); }
      85%  { transform: rotateZ(-1.8deg) rotateY(6deg) rotateX(-2deg) scale(1.008); }
      100% { transform: rotateZ(-4.2deg) rotateY(-8deg) rotateX(4deg) scale(1); }
    }

    /* 8. BRANCH 4 (Lower Right Branch, anchored on Main Stem at 304.9px, 528.9px) */
    .moving-z .sway-branch-4 {
      --ox: 304.9px;
      --oy: 528.9px;
      animation-name: swayBranch4;
      animation-duration: 3.3s;
      animation-delay: -2.5s;
    }
    @keyframes swayBranch4 {
      0%   { transform: rotate(-1.8deg); }
      38%  { transform: rotate(1.2deg); }
      72%  { transform: rotate(2.2deg); }
      100% { transform: rotate(-1.8deg); }
    }

    /* 9. LEAF 4 (Attached to Branch 4 at 361.1px, 597.8px - in front of pot rim!) */
    .moving-z .sway-leaf-4 {
      --ox: 361.1px;
      --oy: 597.8px;
      animation-name: swayLeaf4;
      animation-duration: 2.9s;
      animation-delay: -0.9s;
    }
    @keyframes swayLeaf4 {
      0%   { transform: rotateZ(4.2deg) rotateY(12deg) rotateX(6deg) scale(1); }
      32%  { transform: rotateZ(-3.2deg) rotateY(-10deg) rotateX(-5deg) scale(0.994); }
      66%  { transform: rotateZ(-4.8deg) rotateY(8deg) rotateX(4deg) scale(1.01); }
      100% { transform: rotateZ(4.2deg) rotateY(12deg) rotateX(6deg) scale(1); }
    }

    /* 10. LEAF 5 (Attached at Top Crown of Main Stem at 456.6px, 175.7px) */
    .moving-z .sway-leaf-5 {
      --ox: 456.6px;
      --oy: 175.7px;
      animation-name: swayLeaf5;
      animation-duration: 2.2s;
      animation-delay: -1.1s;
    }
    @keyframes swayLeaf5 {
      0%   { transform: rotateZ(-5.2deg) rotateY(-14deg) rotateX(6deg) scale(1); }
      32%  { transform: rotateZ(4.1deg) rotateY(16deg) rotateX(-6deg) scale(1.02); }
      68%  { transform: rotateZ(2.6deg) rotateY(-8deg) rotateX(3deg) scale(0.988); }
      100% { transform: rotateZ(-5.2deg) rotateY(-14deg) rotateX(6deg) scale(1); }
    }
  </style>
